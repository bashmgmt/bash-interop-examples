[package]
name = "bash-interop-examples"
version = "0.1.0"
edition = "2024"
description = "Worked rigs against the bash-interop public API, and a program a bash fixture starts for itself."
publish = false

[dependencies]

[dev-dependencies]
bash-interop = "0.1"
bash-strings = "0.1"
bashcap = "0.1"
bashprof = "0.1"
tokio = { version = "1.53", features = ["rt", "macros"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"

[[test]]
name = "examples"
path = "tests/examples/main.rs"

[[test]]
name = "merging"
path = "tests/joined/merging.rs"
harness = false
