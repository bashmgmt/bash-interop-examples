name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Siblings are registry deps so this crate stays publishable; until they
      # are on crates.io, resolve them from their repositories. Written here
      # rather than committed, so a local build still uses the checkout beside
      # it.
      - name: resolve sibling crates
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          bash-interop = { git = "https://github.com/bashmgmt/bash-interop" }
          bash-strings = { git = "https://github.com/bashmgmt/bash-strings" }
          hylic = { git = "https://github.com/hylic-recursion/hylic", branch = "mb-ws" }
          bashcap = { git = "https://github.com/bashmgmt/bashcap" }
          bashprof = { git = "https://github.com/bashmgmt/bashprof" }
          EOF
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps --document-private-items

  test:
    name: tests (bash 5, shells serialised)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Siblings are registry deps so this crate stays publishable; until they
      # are on crates.io, resolve them from their repositories. Written here
      # rather than committed, so a local build still uses the checkout beside
      # it.
      - name: resolve sibling crates
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          bash-interop = { git = "https://github.com/bashmgmt/bash-interop" }
          bash-strings = { git = "https://github.com/bashmgmt/bash-strings" }
          hylic = { git = "https://github.com/hylic-recursion/hylic", branch = "mb-ws" }
          bashcap = { git = "https://github.com/bashmgmt/bashcap" }
          bashprof = { git = "https://github.com/bashmgmt/bashprof" }
          EOF
      - run: cargo test --test examples -- --test-threads=1
      - run: cargo test --test merging
